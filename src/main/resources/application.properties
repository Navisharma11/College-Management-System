spring.application.name=college-management-system

server.port=1167

server.servlet.context-path=/CMSApp

server.servlet.session.tracking-modes=cookie


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/college_management_system}
spring.datasource.username=${DB_USERNAME:username}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

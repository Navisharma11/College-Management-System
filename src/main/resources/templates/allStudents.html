<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>All Students | College Management System</title>

    <link rel="stylesheet"
          th:href="@{/css/all-students.css}">

</head>

<body>

<div class="page-wrapper">

    <!-- =========================
         HEADER
         ========================= -->

    <header class="header">

        <div class="brand">

            <div class="brand-icon">
                CMS
            </div>

            <div>
                <h1>College Management</h1>
                <p>Student Management System</p>
            </div>

        </div>


        <!-- Register Student -->

        <a th:href="@{/}"
           class="register-btn">

            Register Student

        </a>

    </header>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main class="main-content">

        <div class="student-card">


            <!-- =========================
                 CARD HEADER
                 ========================= -->

            <div class="card-header">

                <div>

                    <h2>
                        All Students
                    </h2>

                    <p>
                        List of all registered students
                    </p>

                </div>


                <!-- Total Students -->

                <span class="student-count"
                      th:text="${totalStudents}">

                    0

                </span>

            </div>


            <!-- =========================
                 SEARCH SECTION
                 ========================= -->

            <div class="search-section">

                <form th:action="@{/findByName}"
                      method="get">

                    <input type="text"
                           name="name"
                           placeholder="Search student by name"
                           required>

                    <button type="submit"
                            class="search-btn">

                        Search

                    </button>

                </form>


                <!-- Show All -->

                <a th:href="@{/viewAllStudents}"
                   class="show-all-btn">

                    Show All

                </a>

            </div>


            <!-- =========================
                 BRANCH FILTER
                 ========================= -->

            <div class="filter-section">

                <form th:action="@{/filterByBranch}"
                      method="get">

                    <label for="branch">

                        Filter by Branch:

                    </label>


                    <select name="branch"
                            id="branch">

                        <option value="">
                            All Branches
                        </option>

                        <option value="CSE">
                            CSE
                        </option>

                        <option value="ECE">
                            ECE
                        </option>

                        <option value="IT">
                            IT
                        </option>

                        <option value="ME">
                            ME
                        </option>

                        <option value="CE">
                            CE
                        </option>

                        <option value="EE">
                            EE
                        </option>

                    </select>


                    <button type="submit"
                            class="filter-btn">

                        Filter

                    </button>

                </form>

            </div>


            <!-- =========================
                 STUDENT TABLE
                 ========================= -->

            <div class="table-container">

                <table>

                    <!-- TABLE HEADER -->

                    <thead>

                    <tr>

                        <th>ID</th>

                        <th>Name</th>

                        <th>Age</th>

                        <th>Gender</th>

                        <th>Email</th>

                        <th>Phone</th>

                        <th>Year</th>

                        <th>Category</th>

                        <th>Branch</th>

                        <th>City</th>

                        <th>Actions</th>

                    </tr>

                    </thead>


                    <!-- TABLE BODY -->

                    <tbody>


                    <!-- Students -->

                    <tr th:each="student : ${studentInfo}">


                        <!-- ID -->

                        <td th:text="${student.id}">

                        </td>


                        <!-- Name -->

                        <td th:text="${student.firstName + ' ' + student.lastName}">

                        </td>


                        <!-- Age -->

                        <td th:text="${student.age}">

                        </td>


                        <!-- Gender -->

                        <td th:text="${student.gender}">

                        </td>


                        <!-- Email -->

                        <td th:text="${student.email}">

                        </td>


                        <!-- Phone -->

                        <td th:text="${student.phoneNumber}">

                        </td>


                        <!-- Year -->

                        <td th:text="${student.year}">

                        </td>


                        <!-- Category -->

                        <td th:text="${student.category}">

                        </td>


                        <!-- Branch -->

                        <td th:text="${student.branch}">

                        </td>


                        <!-- City -->

                        <td th:text="${student.city}">

                        </td>


                        <!-- =========================
                             ACTIONS
                             ========================= -->

                        <td class="actions">


                            <!-- Edit -->

                            <a th:href="@{/editStudent/{id}(id=${student.id})}"
                               class="edit-btn">

                                Edit

                            </a>


                            <!-- Delete -->

                            <form th:action="@{/deleteStudent/{id}(id=${student.id})}"
                                  method="post"
                                  class="delete-form">

                                <button type="submit"
                                        class="delete-btn"
                                        onclick="return confirm('Are you sure you want to delete this student?');">

                                    Delete

                                </button>

                            </form>


                        </td>

                    </tr>


                    <!-- =========================
                         NO STUDENTS
                         ========================= -->

                    <tr th:if="${#lists.isEmpty(studentInfo)}">

                        <td colspan="11"
                            class="no-students">

                            No students found.

                        </td>

                    </tr>


                    </tbody>

                </table>

            </div>


            <!-- =========================
                 PAGINATION
                 ========================= -->

            <div class="pagination-section"
                 th:if="${totalPages > 0}">


                <!-- =========================
                     PAGINATION INFORMATION
                     ========================= -->

                <div class="pagination-info">

                    Showing

                    <!-- Starting record -->

                    <span th:text="${currentPage * 20 + 1}">
                        1
                    </span>

                    -

                    <!-- Ending record -->
                    <!-- FIXED HERE -->

                    <span th:text="${currentPage * 20 + #lists.size(studentInfo)}">
                        20
                    </span>

                    of

                    <!-- Total records -->

                    <span th:text="${totalStudents}">
                        0
                    </span>

                    students

                </div>


                <!-- =========================
                     PAGINATION BUTTONS
                     ========================= -->

                <div class="pagination">


                    <!-- FIRST PAGE -->

                    <a th:if="${currentPage > 0}"
                       th:href="@{/viewAllStudents(page=0)}"
                       class="page-btn">

                        &laquo;

                    </a>


                    <!-- PREVIOUS -->

                    <a th:if="${currentPage > 0}"
                       th:href="@{/viewAllStudents(page=${currentPage - 1})}"
                       class="page-btn">

                        Previous

                    </a>


                    <!-- PAGE NUMBERS -->

                    <a th:each="pageNumber : ${#numbers.sequence(0, totalPages - 1)}"
                       th:href="@{/viewAllStudents(page=${pageNumber})}"
                       th:text="${pageNumber + 1}"
                       th:class="${pageNumber == currentPage
                                  ? 'page-btn active'
                                  : 'page-btn'}">

                        1

                    </a>


                    <!-- NEXT -->

                    <a th:if="${currentPage < totalPages - 1}"
                       th:href="@{/viewAllStudents(page=${currentPage + 1})}"
                       class="page-btn">

                        Next

                    </a>


                    <!-- LAST PAGE -->

                    <a th:if="${currentPage < totalPages - 1}"
                       th:href="@{/viewAllStudents(page=${totalPages - 1})}"
                       class="page-btn">

                        &raquo;

                    </a>


                </div>

            </div>


        </div>

    </main>

</div>

</body>

</html>
